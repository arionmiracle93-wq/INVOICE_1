  <script>
    let rowCounter = 0;
    let productCatalog = [];
    let autosaveTimer = null;
    let isApplyingData = false;

    const DRAFT_KEY = 'pp_invoice_draft_v1';
    const HISTORY_KEY = 'pp_invoice_history_v1';
    const SEQUENCE_KEY = 'pp_invoice_sequence_v1';

    function formatRp(num){
      if(isNaN(num)) num = 0;
      return 'Rp ' + Math.round(num).toLocaleString('id-ID');
    }

    function parseNum(v){
      const n = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
      return isNaN(n) ? 0 : n;
    }

    function parseThousands(v){
      const digits = String(v).replace(/[^0-9]/g,'');
      return digits ? parseInt(digits, 10) : 0;
    }

    function formatHargaInput(inp){
      const digits = inp.value.replace(/[^0-9]/g,'');
      const caretFromEnd = inp.value.length - (inp.selectionEnd || inp.value.length);
      inp.value = digits ? parseInt(digits, 10).toLocaleString('id-ID') : '';
      const pos = Math.max(0, inp.value.length - caretFromEnd);
      if(typeof inp.setSelectionRange === 'function'){
        inp.setSelectionRange(pos, pos);
      }
    }

    function formatM2Input(inp){
      const caretFromEnd = inp.value.length - (inp.selectionEnd || inp.value.length);
      let raw = inp.value.replace(/[^0-9,]/g, '');
      const firstComma = raw.indexOf(',');
      if(firstComma !== -1){
        raw = raw.slice(0, firstComma + 1) + raw.slice(firstComma + 1).replace(/,/g, '');
      }
      let [intPart, decPart] = raw.split(',');
      intPart = intPart ? String(parseInt(intPart, 10)) : '';
      const formattedInt = intPart ? parseInt(intPart, 10).toLocaleString('id-ID') : '';
      inp.value = (raw.includes(',')) ? formattedInt + ',' + (decPart || '') : formattedInt;
      const pos = Math.max(0, inp.value.length - caretFromEnd);
      if(typeof inp.setSelectionRange === 'function'){
        inp.setSelectionRange(pos, pos);
      }
    }

    function parseM2(v){
      const n = parseFloat(String(v).replace(/\./g, '').replace(',', '.'));
      return isNaN(n) ? 0 : n;
    }

    function autoGrow(ta){
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    }

    function parseCatalogText(value){
      return String(value || '').split('\n').map(line => {
        const parts = line.split('|').map(part => part.trim());
        if(!parts[0]) return null;
        return {name:parts[0], description:parts[1] || '', harga:parts[2] || '', tiers:parts[3] || ''};
      }).filter(Boolean);
    }

    function catalogToText(){
      return productCatalog.map(item =>
        [item.name, item.description, item.harga, item.tiers || ''].join(' | ')
      ).join('\n');
    }

    // ---- Catalog CSV import/export ----
    function csvEscape(value){
      return '"' + String(value == null ? '' : value).replace(/"/g, '""') + '"';
    }

    function downloadBlob(blob, filename){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
